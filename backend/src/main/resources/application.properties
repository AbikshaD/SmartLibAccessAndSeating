spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/library_management}
spring.mongodb.database=${MONGODB_DATABASE:library_management}
server.port=${PORT:${SERVER_PORT:8080}}
app.frontend-origin=${FRONTEND_ORIGIN:}
security.jwt.secret=${SECURITY_JWT_SECRET:library-management-development-secret-key-change-in-production-2026}
security.jwt.expiration-ms=${SECURITY_JWT_EXPIRATION_MS:3600000}

groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.api.model=${GROQ_API_MODEL:openai/gpt-oss-120b}
groq.api.key=${GROQ_API_KEY:}