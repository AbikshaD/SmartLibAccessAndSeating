services:
  - type: web
    name: smartlib-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: library_management
      - key: SECURITY_JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: smartlib-frontend
          property: host
      - key: app.frontend-origin
        fromService:
          type: web
          name: smartlib-frontend
          property: host

  - type: web
    name: smartlib-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: smartlib-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
